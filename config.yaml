# Global defaults for fine-tuning and evaluation runs.
# Individual experiments may override these values; see 03_Experiments/.

paths:
  data_dir: data/
  output_dir: results/
  cache_dir: .cache/

model:
  base_model_name: "Qwen/Qwen2.5-0.5B"  # chosen for fast iteration (Week 1 goal: full pipeline in <12h); already benchmarked in results/vram_benchmark.json

data:
  dataset_name: "databricks/databricks-dolly-15k"  # Week 1 pipeline dataset (small, real, CC BY-SA 3.0); not the final research dataset — that's chosen in Week 4

training:
  seed: 42
  precision: bf16
  full_finetune: true  # Week 1: full fine-tuning, small enough model to afford it; LoRA/QLoRA start in Week 3
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
  learning_rate: 2.0e-5  # Week 2 correction: 2.0e-4 was an order of magnitude too high for full fine-tuning (caused the Week 1 overfitting: 13.92 -> 75.41); 2e-4 is fine for LoRA (Week 3), not full FT
  warmup_ratio: 0.03  # Week 2 correction: protects the first steps from the (still nonzero) learning rate before it's had time to warm up
  lr_scheduler_type: cosine  # Week 2 correction: smooth decay to 0 by the end of training, instead of a flat rate throughout
  batch_size: 4
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  num_epochs: 3  # Week 2 correction: kept as a ceiling, not a fixed target — early stopping (below) decides the real stopping point
  eval_steps: 100  # Week 2 correction: how often to check validation loss during training, to catch overfitting as it happens rather than only after
  early_stopping_patience: 3  # Week 2 correction: stop if validation loss hasn't improved for this many evaluations in a row
  max_seq_length: 512
  logging_backend: tensorboard  # no external account needed; switch to "wandb" once a wandb account/API key is set up

dpo:
  dataset_name: "trl-lib/ultrafeedback_binarized"  # Week 3: general-domain preference pairs, already in chosen/rejected format
  train_size: 1000  # small subset per the contract's "small DPO experiment" — full dataset is 62k pairs
  eval_size: 100
  beta: 0.1  # KL penalty strength against the frozen reference model (same beta as the PPO/DPO math)
  learning_rate: 5.0e-6  # DPO fine-tunes an already-instruction-tuned checkpoint; smaller than SFT's LR to avoid undoing that tuning
  num_epochs: 1
  eval_steps: 20

eval:
  benchmarks: []

wandb:
  project: llm-alignment-internship
  mode: online
